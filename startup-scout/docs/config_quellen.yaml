# In deine config.yaml unter "sources:" einfügen (bestehende rss/csv-Einträge behalten, ein altes "pages:" ersetzen).
# Unter "run:" setzen:  max_candidates: 300   und   max_item_age_days: 120
# status: erscheint hinter dem Quellennamen in PDF/Excel/Log, z.B. "HTGF Portfolio [ungetestet]".
#   ungetestet = Abruf technisch denkbar, aber noch kein echter Lauf  ·  ungeprüft = Seitenaufbau unbekannt, evtl. 0 Treffer
  json:
    - {name: "YC Climate", url: "https://yc-oss.github.io/api/industries/climate.json", website_field: website}
    - {name: "YC Climatetech", url: "https://yc-oss.github.io/api/tags/climatetech.json", website_field: website}
    - {name: "YC Renewable Energy", url: "https://yc-oss.github.io/api/tags/renewable-energy.json", website_field: website}
    - {name: "YC Sustainability", url: "https://yc-oss.github.io/api/tags/sustainability.json", website_field: website}
    - {name: "YC Carbon Capture", url: "https://yc-oss.github.io/api/tags/carbon-capture-and-removal.json", website_field: website}
    - {name: "ESA BIC Startups", url: "https://commercialisation.esa.int/wp-json/wp/v2/esa-startups?per_page=100", pages: 5, status: ungetestet}
  sitemaps:
