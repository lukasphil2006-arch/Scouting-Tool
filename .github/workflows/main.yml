name: Startup Scouting

on:
  schedule:
    - cron: "0 5 1 * *"      # am 1. jedes Monats, 6 Uhr deutscher Zeit (Winter)
  workflow_dispatch:
    inputs:
      neu_pruefen:
        description: "Gesamtliste mit den aktuellen Regeln/KI neu prüfen (keine neuen Quellen, keine Mail)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: startup-scout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: startup-scout/requirements.txt
      - run: pip install -r requirements.txt
      - name: Scouting ausführen
        run: python -m scout.main --config config.yaml --out output ${{ inputs.neu_pruefen && '--recheck' || '' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
      - name: Liste als Archiv ablegen
        uses: actions/upload-artifact@v4
        with:
          name: scouting-bericht
          path: |
            startup-scout/output/*.html
            startup-scout/output/*.xlsx
          retention-days: 30
      - name: Merkzettel und Gesamtliste speichern
        run: |
          git config user.name "scouting-bot"
          git config user.email "scouting-bot@users.noreply.github.com"
          git add data/state.json
          if [ -f data/gesamtliste.xlsx ]; then git add data/gesamtliste.xlsx; fi
          git diff --cached --quiet || (git commit -m "Merkzettel und Gesamtliste aktualisiert" && git push)
