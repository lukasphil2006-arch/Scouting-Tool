name: Startup Scouting

on:
  schedule:
    - cron: "0 5 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scouting ausführen
        run: python -m scout.main --config config.yaml --out output
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Liste als Archiv ablegen
        uses: actions/upload-artifact@v4
        with:
          name: scouting-liste
          path: output/*.xlsx
          retention-days: 30
      - name: Merkzettel speichern
        run: |
          git config user.name "scouting-bot"
          git config user.email "scouting-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "Merkzettel aktualisiert" && git push)
